[package]
name = "anchor-spl"
version = "0.30.1"
description = "Anchor Rust primitives for Solana SPL programs"
authors = ["Anchor Maintainers"]
repository = "https://github.com/coral-xyz/anchor"
homepage = "https://coral-xyz.github.io/anchor/"
documentation = "https://docs.rs/anchor-spl"
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
dex = ["openbook-dex"]
gated-token = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { path = "../lang", version = "=0.31.1" }
solana-program = { git = "https://github.com/hamkj7hpo/solana.git", rev = "5208a7870826307290c30b7d80768f40267433a1" }
spl-token = { git = "https://github.com/hamkj7hpo/solana-program-library.git", rev = "f81cfea71b4b961e1c7daf82d8f307ad9b3bc194", package = "spl-token" }
spl-associated-token-account = { git = "https://github.com/hamkj7hpo/associated-token-account.git", rev = "16c9441f1adc7493c7dd9a6985cf1ecfef647e2a" }
spl-discriminator = { git = "https://github.com/hamkj7hpo/solana-program-library.git", rev = "f81cfea71b4b961e1c7daf82d8f307ad9b3bc194", package = "spl-discriminator" }
spl-pod = { git = "https://github.com/hamkj7hpo/spl-pod.git", rev = "0ff7d641b198149f6e0b1265e85b7258db87e254" }
spl-token-2022 = { git = "https://github.com/hamkj7hpo/token-2022.git", rev = "c264648641cfa1ef2a377e3d026d6423f2a21d7c", features = ["no-entrypoint"] }
spl-token-group-interface = { git = "https://github.com/hamkj7hpo/token-group.git", rev = "decb8c063443bbd67ad7d00e7fbfab3a76029620" }
spl-token-metadata-interface = { git = "https://github.com/hamkj7hpo/token-metadata.git", rev = "fcb4a1c79576a6d4eb8dea8dd38b370529dda008" }
spl-transfer-hook-interface = { git = "https://github.com/hamkj7hpo/transfer-hook.git", rev = "7be529916806e8693d6fb2622db31e5d463e9f79" }
spl-type-length-value = { git = "https://github.com/hamkj7hpo/spl-type-length-value.git", rev = "5328db539266002834f15d0ae8881a61d99d78e9" }
openbook-dex = { version = "0.0.1", optional = true }
