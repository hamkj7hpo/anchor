[package]
name = "anchor-spl"
version = "0.30.1"
edition = "2021"
description = "Anchor SPL - utility library for Solana Anchor programs to interface with SPL programs"
repository = "https://github.com/hamkj7hpo/anchor"
license = "Apache-2.0 OR MIT"
documentation = "https://docs.rs/anchor-spl"

[lib]
doctest = false

[features]
default = ["token", "associated-token"]
dex = ["serum-dex"]
gated-token = ["spl-token-group-interface"]
metadata = ["mpl-token-metadata"]
token = ["spl-token"]
token-2022 = ["spl-token-2022"]
associated-token = ["spl-associated-token-account"]
token-group = ["spl-token-group-interface"]
transfer-hook = ["spl-transfer-hook-interface"]
memo = ["spl-memo"]

[dependencies]
anchor-lang = { path = "../lang", version = "0.30.1" }
solana-program = { git = "https://github.com/solana-labs/solana.git", rev = "b1e378009ffee4c75965723d3317fccbebcf2524" }
spl-token = { version = "4.0", optional = true }
spl-token-2022 = { git = "https://github.com/hamkj7hpo/token-2022.git", rev = "8e65bc7ef9b22a5f0765c22e4b2ae4b3652bc2b6", optional = true, default-features = false }
spl-associated-token-account = { git = "https://github.com/hamkj7hpo/associated-token-account.git", rev = "e8d16e4e762e9ff008fc0c3da2e997b2f949a727", optional = true, default-features = false }
mpl-token-metadata = { version = "4.1.2", optional = true }
serum-dex = { version = "0.5.6", optional = true, features = ["no-entrypoint"] }
spl-token-group-interface = { git = "https://github.com/hamkj7hpo/token-group.git", rev = "decb8c063443bbd67ad7d00e7fbfab3a76029620", optional = true }
spl-transfer-hook-interface = { git = "https://github.com/hamkj7hpo/transfer-hook.git", rev = "7be529916806e8693d6fb2622db31e5d463e9f79", optional = true }
spl-memo = { git = "https://github.com/hamkj7hpo/memo.git", rev = "8b68bff69ad2616c511f58c16e7588e8997c076c", version = "6.0.0", optional = true }
bytemuck = { version = "1.18.0", features = ["derive"] }

[patch.crates-io]
solana-program = { git = "https://github.com/solana-labs/solana.git", rev = "b1e378009ffee4c75965723d3317fccbebcf2524" }
spl-token-2022 = { git = "https://github.com/hamkj7hpo/token-2022.git", rev = "8e65bc7ef9b22a5f0765c22e4b2ae4b3652bc2b6", default-features = false }
spl-associated-token-account = { git = "https://github.com/hamkj7hpo/associated-token-account.git", rev = "e8d16e4e762e9ff008fc0c3da2e997b2f949a727", default-features = false }
spl-token-group-interface = { git = "https://github.com/hamkj7hpo/token-group.git", rev = "decb8c063443bbd67ad7d00e7fbfab3a76029620" }
spl-transfer-hook-interface = { git = "https://github.com/hamkj7hpo/transfer-hook.git", rev = "7be529916806e8693d6fb2622db31e5d463e9f79" }
spl-memo = { git = "https://github.com/hamkj7hpo/memo.git", rev = "8b68bff69ad2616c511f58c16e7588e8997c076c", version = "6.0.0" }
